<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}BYOK Operator{% endblock %}</title>
<style>
:root{--bg:#0f1420;--panel:#182034;--line:#2a3550;--txt:#dbe4f5;--dim:#8fa0c2;--acc:#5aa2ff;--ok:#3ecf8e;--warn:#ffb020;--bad:#ff5d5d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,sans-serif}
nav{background:#0b0f1a;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:18px;align-items:center;position:sticky;top:0}
nav a{color:var(--dim);text-decoration:none;font-weight:600}nav a:hover,nav a.on{color:var(--acc)}
main{max-width:1100px;margin:0 auto;padding:22px 18px}
table{width:100%;border-collapse:collapse;margin:14px 0}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--dim);text-transform:uppercase;font-size:11px;letter-spacing:.06em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
.btn{background:var(--acc);color:#06121f;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.btn.danger{background:var(--bad);color:#fff}.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.ok{background:var(--ok);color:#06240f}
input,select,textarea{background:#0b0f1a;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;margin:4px 6px 4px 0}
form.inline{display:inline}
h1{font-size:22px;margin:6px 0 14px}h2{font-size:17px;margin:18px 0 8px}
.mono{font-family:ui-monospace,monospace;font-size:13px}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}
.pill.on{background:#3a1620;color:var(--bad);border:1px solid var(--bad)}
.pill.off{background:#0f2c1c;color:var(--ok);border:1px solid var(--ok)}
.note{color:var(--dim);font-size:13px}
.bar{height:10px;background:#0b0f1a;border-radius:6px;overflow:hidden;min-width:120px}
.bar>i{display:block;height:100%;background:var(--ok)}
.bar>i.hot{background:var(--warn)}.bar>i.over{background:var(--bad)}
pre{background:#0b0f1a;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-size:12px;max-height:320px}
.kbd{background:#0b0f1a;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
</style>
</head>
<body>
<nav>
<strong>BYOK&nbsp;Operator</strong>
<a href="/keys">Keys</a><a href="/spend">Spend</a><a href="/runs">Runs</a>
<a href="/kill">Kill&nbsp;switch</a><a href="/routing">Routing</a><a href="/approvals">Approvals</a>
</nav>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
